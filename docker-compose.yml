
services:
  db:
    image: postgres:17
    container_name: tutor_bot_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: tutor_bot
      POSTGRES_USER: tutor_user
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor_user -d tutor_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
